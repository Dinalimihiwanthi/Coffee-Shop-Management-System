<body class="p-3">

    <div class="cafe-card p-4 p-sm-5 text-center">
        <!-- Logo Header Section -->
        <div class="mb-4">
            <div class="display-5 text-warning mb-2"><i class="bi bi-shop"></i></div>
            <h2 class="fw-bold mb-1" style="color: var(--coffee-dark);">DP COFFEE SHOP</h2>

        <h3 class="mb-4 text-start text-secondary fs-5 fw-bold">JOIN OUR WEBSITE</h3>
        
        <!-- Updated Action Pipeline targeting signup dynamic streams -->
        <form id="signupForm" action="signup.php" method="POST" class="text-start">
            
            <!-- Phone Input Element -->
            <div class="mb-3">
                <label for="phoneNumber" class="form-label text-uppercase">Phone Number</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-telephone-fill"></i></span>
                    <input type="tel" name="phone_number" class="form-control" id="phoneNumber" placeholder="e.g., 0777123467" required>
                </div>
            </div>

            <!-- Delivery / Order Address Field with Dynamic Map Container -->
            <div class="mb-3">
                <label for="deliveryAddress" class="form-label text-uppercase">Delivery Address</label>
                <div class="input-group mb-2">
                    <span class="input-group-text"><i class="bi bi-geo-alt-fill"></i></span>
                    <textarea name="delivery_address" class="form-control" id="deliveryAddress" rows="2" placeholder="e.g., No. 45, Main Street, Colombo" required></textarea>
                </div>
                
                <!-- Map view container -->
                <div id="map"></div>
                <small class="text-muted" style="font-size: 0.75rem;">
                    <i class="bi bi-info-circle me-1"></i>Type an address or tap the map to place a pin.
                </small>
            </div>

            <!-- Password / ID Extraction UI Component -->
            <div class="mb-4">
                <label for="customerId" class="form-label text-uppercase">Password</label>
                <div class="input-group mb-2">
                    <span class="input-group-text"><i class="bi bi-person-badge-fill"></i></span>
                    <input type="text" class="form-control" id="customerId" placeholder="e.g., 200077712224 or 00333555815" required>
                </div>
                <div class="cafe-info">
                    <i class="bi bi-info-circle-fill me-1"></i> Enter only the whole integer part of your ID number. If your integer part does not have 12 integers, enter 2 zeros to the front.
                </div>
            </div>

            <!-- Intercepted structural storage parameters payload value mapping tag -->
            <input type="hidden" id="password" name="password">

            <!-- Fixed submission link wrap error matrix component execution -->
            <div class="d-grid mt-4">
                <button type="submit" class="btn btn-coffee btn-lg text-uppercase border-0">

                </button>

        <div class="mt-4">

    <!-- Bootstrap 5 Runtime Engine -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Leaflet JS Engine -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <script>
        // 1. Initialize Map centered default (e.g. Colombo coordinates)
        const defaultLat = 6.9271;
        const defaultLng = 79.8612;
        const map = L.map('map').setView([defaultLat, defaultLng], 12);

        // Load OpenStreetMap Tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        let marker = L.marker([defaultLat, defaultLng], { draggable: true }).addTo(map);

        // 2. Function to fetch coordinates from typed address (Geocoding)
        let debounceTimer;
        const addressInput = document.getElementById('deliveryAddress');

        function geocodeAddress(addressText) {
            if (!addressText.trim()) return;

            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(addressText)}`)
                .then(response => response.json())
                .then(data => {
                    if (data && data.length > 0) {
                        const lat = parseFloat(data[0].lat);
                        const lon = parseFloat(data[0].lon);

                        // Move map & marker
                        map.setView([lat, lon], 15);
                        marker.setLatLng([lat, lon]);
                    }
                })
                .catch(err => console.error('Geocoding error:', err));
        }

        // Trigger map lookup when user finishes typing
        addressInput.addEventListener('input', function() {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                geocodeAddress(this.value);
            }, 1000); // Waits 1 second after typing stops
        });

        // 3. Reverse Geocoding when user clicks or drags pin on the map
        function updateAddressFromCoords(lat, lng) {
            fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`)
                .then(res => res.json())
                .then(data => {
                    if (data && data.display_name) {
                        addressInput.value = data.display_name;
                    }
                })
                .catch(err => console.error('Reverse Geocoding error:', err));
        }

        // Handle Map Clicks
        map.on('click', function(e) {
            const { lat, lng } = e.latlng;
            marker.setLatLng([lat, lng]);
            updateAddressFromCoords(lat, lng);
        });

        // Handle Pin Dragging
        marker.on('dragend', function(e) {
            const position = marker.getLatLng();
            updateAddressFromCoords(position.lat, position.lng);
        });

        // Form Submit Handler
       // Form Submit Handler
document.getElementById('signupForm').addEventListener('submit', function(event) {
    event.preventDefault();

    const idInput = document.getElementById('customerId').value;
    const integerPassword = parseInt(idInput, 10);

    if (isNaN(integerPassword)) {
        alert('Please enter a valid Customer ID containing numbers.');
        return;
    }

    document.getElementById('password').value = integerPassword;
    
    // Get current marker coordinates and address
    const currentPos = marker.getLatLng();
    const currentAddress = addressInput.value;

    // Save location payload locally for the delivery/checkout page
    localStorage.setItem('delivery_address', currentAddress);
    localStorage.setItem('delivery_lat', currentPos.lat);
    localStorage.setItem('delivery_lng', currentPos.lng);

    const formData = new FormData(this);

    fetch('signup.php', {
        method: 'POST',
        body: formData
    })
    .then(response => response.json())
    .then(data => {
        alert(data.message); 
        if(data.status === 'success') {
            document.getElementById('signupForm').reset();
            // Redirect to delivery page or login page
            setTimeout(() => { window.location.href = 'delivery_page.html'; }, 1000);
        }
    })
    .catch(error => {
        console.error('Error:', error);
        alert('Connection error. Failed to reach server runtime environment.');
    });
});
    </script>
