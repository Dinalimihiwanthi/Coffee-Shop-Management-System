<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barista & Kitchen Display | DP COFFEE SHOP</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --coffee-dark: #2c1b18;
            --coffee-accent: #8c6239;
            --coffee-light: #f4f1ea;
        }
        body {
            background-color: #1a1a1a; /* Dark background for high visibility in kitchen environments */
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }
        .navbar-custom {
            background-color: var(--coffee-dark);
            border-bottom: 3px solid var(--coffee-accent);
        }
        .order-card {
            background-color: #2b2b2b;
            border-radius: 12px;
            border: 2px solid #3d3d3d;
            transition: border-color 0.2s ease, transform 0.2s ease;
        }
        .order-card.status-pending {
            border-color: #ffc107; /* Yellow border for new incoming orders */
        }
        .order-card.status-preparing {
            border-color: #0d6efd; /* Blue border for active brewing/cooking */
        }
        .order-card.status-ready {
            border-color: #198754; /* Green border for orders ready for customer pickup */
        }
        .badge-barista {
            background-color: #fd7e14;
            font-size: 0.75rem;
        }
        .timer-badge {
            font-family: monospace;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <!-- Top Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom px-4 py-2 shadow-sm">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="#">
                <i class="bi bi-cup-hot-fill text-warning"></i> DP COFFEE SHOP — Kitchen Display System (KDS)
            </a>
            <div class="d-flex align-items-center gap-3">
                <span class="badge badge-barista p-2 d-flex align-items-center gap-1">
                    <i class="bi bi-person-badge"></i> ROLE: BARISTA / KITCHEN
                </span>
                <button onclick="fetchKitchenOrders()" class="btn btn-outline-light btn-sm rounded-2">
                    <i class="bi bi-arrow-clockwise"></i> Refresh Queue
                </button>
                <button onclick="logout()" class="btn btn-outline-danger btn-sm rounded-2">
                    <i class="bi bi-box-arrow-right"></i> Logout
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="container-fluid py-4 px-4">
        
        <!-- Global Notification Banner -->
        <div id="statusAlert" class="alert d-none text-center alert-dismissible fade show position-fixed top-0 start-50 translate-middle-x mt-3 z-3 shadow" role="alert">
            <span id="alertMessage"></span>
            <button type="button" class="btn-close" onclick="hideAlert()" aria-label="Close"></button>
        </div>

        <!-- Filter Controls & Summary Cards -->
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
            <div class="btn-group" role="group" id="filterGroup">
                <input type="radio" class="btn-check" name="statusFilter" id="filterAll" value="ALL" checked onchange="filterOrders()">
                <label class="btn btn-outline-light" for="filterAll">All Active (<span id="countAll">0</span>)</label>

                <input type="radio" class="btn-check" name="statusFilter" id="filterPending" value="PENDING" onchange="filterOrders()">
                <label class="btn btn-outline-warning" for="filterPending">New Orders (<span id="countPending">0</span>)</label>

                <input type="radio" class="btn-check" name="statusFilter" id="filterPreparing" value="PREPARING" onchange="filterOrders()">
                <label class="btn btn-outline-primary" for="filterPreparing">Preparing (<span id="countPreparing">0</span>)</label>

                <input type="radio" class="btn-check" name="statusFilter" id="filterReady" value="READY" onchange="filterOrders()">
                <label class="btn btn-outline-success" for="filterReady">Ready for Pickup (<span id="countReady">0</span>)</label>
            </div>

            <div class="text-muted small">
                <i class="bi bi-broadcast me-1 text-success"></i> Auto-refreshing order queue every 5 seconds
            </div>
        </div>

        <!-- Live Orders Display Grid -->
        <div class="row g-3" id="ordersContainer">
            <!-- JavaScript dynamically inserts kitchen order cards here -->
        </div>

    </main>

    <!-- JavaScript KDS Processing Engine -->
    <script>
        const API_KITCHEN_ENDPOINT = "http://localhost:8080/api/orders/kitchen";

        let kitchenOrders = [];

        function getAuthHeaders() {
            const token = localStorage.getItem("jwtToken");
            return {
                "Content-Type": "application/json",
                "Authorization": token ? `Bearer ${token}` : ""
            };
        }

        document.addEventListener("DOMContentLoaded", () => {
            fetchKitchenOrders();
            // Polling interval: Auto-fetch new incoming orders every 5 seconds
            setInterval(fetchKitchenOrders, 5000);
        });

        // 1. Fetch live order queue from Spring Boot REST endpoint
        async function fetchKitchenOrders() {
            try {
                const res = await fetch(API_KITCHEN_ENDPOINT, { headers: getAuthHeaders() });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                kitchenOrders = await res.json();
                
                updateCounters();
                filterOrders();
            } catch (err) {
                console.error("KDS Fetch Error:", err);
            }
        }

        // 2. Render Kitchen Order Cards
        function renderOrders(ordersToDisplay) {
            const container = document.getElementById("ordersContainer");
            container.innerHTML = "";

            if (ordersToDisplay.length === 0) {
                container.innerHTML = `
                    <div class="col-12 text-center py-5 text-muted">
                        <i class="bi bi-cup-hot fs-1 d-block mb-3"></i>
                        <h5>Kitchen Queue Clear!</h5>
                        <p class="small">There are currently no active orders waiting in this view.</p>
                    </div>
                `;
                return;
            }

            ordersToDisplay.forEach(order => {
                const col = document.createElement("div");
                col.className = "col-12 col-md-6 col-lg-4 col-xl-3";

                let borderClass = "status-pending";
                let statusBadge = `<span class="badge bg-warning text-dark">PENDING</span>`;
                let actionButton = `
                    <button onclick="updateOrderStatus('${order.orderId}', 'PREPARING')" class="btn btn-primary w-100 fw-bold">
                        <i class="bi bi-play-circle me-1"></i> Start Preparing
                    </button>
                `;

                if (order.status === "PREPARING") {
                    borderClass = "status-preparing";
                    statusBadge = `<span class="badge bg-primary">PREPARING</span>`;
                    actionButton = `
                        <button onclick="updateOrderStatus('${order.orderId}', 'READY')" class="btn btn-success w-100 fw-bold">
                            <i class="bi bi-check-circle me-1"></i> Mark as Ready
                        </button>
                    `;
                } else if (order.status === "READY") {
                    borderClass = "status-ready";
                    statusBadge = `<span class="badge bg-success">READY FOR PICKUP</span>`;
                    actionButton = `
                        <button onclick="updateOrderStatus('${order.orderId}', 'COMPLETED')" class="btn btn-outline-light w-100 fw-bold">
                            <i class="bi bi-box-arrow-right me-1"></i> Complete Order
                        </button>
                    `;
                }

                // Format item list HTML
                let itemsHtml = "";
                if (order.items && order.items.length > 0) {
                    order.items.forEach(item => {
                        itemsHtml += `
                            <li class="list-group-item bg-transparent text-white border-secondary d-flex justify-content-between align-items-center py-2 px-0">
                                <div>
                                    <span class="fw-bold fs-5 text-warning me-2">${item.quantity}x</span>
                                    <span class="fs-6">${escapeHtml(item.itemName || 'Item')}</span>
                                </div>
                                ${item.notes ? `<span class="badge bg-secondary">${escapeHtml(item.notes)}</span>` : ''}
                            </li>
                        `;
                    });
                }

                col.innerHTML = `
                    <div class="card order-card ${borderClass} h-100 p-3 d-flex flex-column justify-content-between">
                        <div>
                            <div class="d-flex justify-content-between align-items-center pb-2 border-bottom border-secondary mb-2">
                                <h5 class="fw-bold mb-0 text-white">#${escapeHtml(order.orderId || '000')}</h5>
                                ${statusBadge}
                            </div>
                            
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <small class="text-muted"><i class="bi bi-clock me-1"></i>${escapeHtml(order.orderTime || 'Just now')}</small>
                                <span class="badge bg-dark border border-secondary text-info timer-badge">${escapeHtml(order.paymentMethod || 'CASH')}</span>
                            </div>

                            <ul class="list-group list-group-flush mb-3">
                                ${itemsHtml}
                            </ul>
                        </div>

                        <div class="pt-2 border-top border-secondary">
                            ${actionButton}
                        </div>
                    </div>
                `;
                container.appendChild(col);
            });
        }

        // 3. Update order state via backend REST call
        async function updateOrderStatus(orderId, newStatus) {
            try {
                const res = await fetch(`${API_KITCHEN_ENDPOINT}/${orderId}/status`, {
                    method: "PATCH",
                    headers: getAuthHeaders(),
                    body: JSON.stringify({ status: newStatus })
                });

                if (!res.ok) throw new Error(`HTTP ${res.status}`);

                showAlert(`Order #${orderId} set to ${newStatus}`, "success");
                fetchKitchenOrders(); // Refresh order queue immediately

            } catch (err) {
                showAlert(`Failed to update status: ${err.message}`, "danger");
            }
        }

        // 4. Update Header Metrics
        function updateCounters() {
            const pending = kitchenOrders.filter(o => o.status === "PENDING").length;
            const preparing = kitchenOrders.filter(o => o.status === "PREPARING").length;
            const ready = kitchenOrders.filter(o => o.status === "READY").length;

            document.getElementById("countAll").innerText = kitchenOrders.length;
            document.getElementById("countPending").innerText = pending;
            document.getElementById("countPreparing").innerText = preparing;
            document.getElementById("countReady").innerText = ready;
        }

        // 5. Filter Queue View by Selected Radio
        function filterOrders() {
            const selectedFilter = document.querySelector('input[name="statusFilter"]:checked').value;
            if (selectedFilter === "ALL") {
                renderOrders(kitchenOrders);
            } else {
                const filtered = kitchenOrders.filter(o => o.status === selectedFilter);
                renderOrders(filtered);
            }
        }

        function showAlert(msg, type) {
            const container = document.getElementById('statusAlert');
            const targetSpan = document.getElementById('alertMessage');
            container.className = `alert alert-${type} text-center alert-dismissible fade show position-fixed top-0 start-50 translate-middle-x mt-3 z-3 shadow`;
            targetSpan.innerText = msg;
            setTimeout(() => hideAlert(), 3000);
        }

        function hideAlert() {
            document.getElementById('statusAlert').classList.add('d-none');
        }

        function logout() {
            localStorage.removeItem("jwtToken");
            window.location.href = "welcome.html";
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
