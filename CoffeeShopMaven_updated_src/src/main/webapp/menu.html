<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Order System | DP COFFEE SHOP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    
    <style>
        body {
            background: linear-gradient(135deg, #1c0d02 0%, #3d2314 40%, #2b1810 80%, #5c3a21 100%);
            background-size: 300% 300%;
            min-height: 100vh;
            color: #fff8f0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding: 40px 0 160px 0; 
        }

        .dashboard-container {
            background: rgba(43, 24, 16, 0.45);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(244, 164, 96, 0.2);
            border-radius: 28px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            padding: 40px;
        }

        .brand-logo {
            font-size: 2rem;
            color: #f4a460;
            text-shadow: 0 0 10px rgba(244, 164, 96, 0.4);
        }

        .filter-btn {
            color: rgba(255, 244, 229, 0.7);
            border: 1px solid rgba(244, 164, 96, 0.3);
            border-radius: 12px;
            padding: 8px 20px;
            transition: all 0.2s;
        }
        .filter-btn.active, .filter-btn:hover {
            background: #f4a460 !important;
            color: #1c0d02 !important;
            font-weight: 600;
            border-color: #f4a460;
        }

        .menu-card {
            background: rgba(255, 248, 240, 0.05);
            border: 1.5px solid rgba(244, 164, 96, 0.15);
            border-radius: 18px;
            overflow: hidden;
            transition: all 0.25s ease-in-out;
            height: 100%;
            cursor: pointer;
            position: relative;
        }

        .menu-card:hover {
            transform: translateY(-4px);
            border-color: rgba(244, 164, 96, 0.4);
        }

        .menu-card.selected {
            background: rgba(244, 164, 96, 0.12);
            border-color: #f4a460 !important;
            box-shadow: 0 0 20px rgba(244, 164, 96, 0.3);
        }

        .select-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: #f4a460;
            color: #1c0d02;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 5;
        }

        .menu-card.selected .select-badge {
            opacity: 1;
            transform: scale(1);
        }

        .menu-img-wrapper {
            width: 100%;
            height: 160px;
            position: relative;
            background: rgba(43, 24, 16, 0.5);
        }

        .menu-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .menu-details {
            padding: 15px;
        }

        .item-title {
            color: #ffffff;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .item-price {
            color: #f4a460;
            font-weight: 700;
            font-size: 1.15rem;
        }

        .payment-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(28, 13, 2, 0.95);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-top: 2px solid rgba(244, 164, 96, 0.3);
            padding: 20px 0;
            z-index: 1000;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
        }

        .summary-label {
            font-size: 0.85rem;
            color: rgba(255, 244, 229, 0.5);
            letter-spacing: 1px;
        }

        .summary-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #ffffff;
        }

        .btn-pay {
            background: linear-gradient(90deg, #d2691e 0%, #f4a460 100%);
            border: none;
            color: #1c0d02;
            font-weight: 800;
            letter-spacing: 1px;
            border-radius: 14px;
            padding: 14px 40px;
            box-shadow: 0 4px 15px rgba(212, 105, 30, 0.4);
            transition: all 0.25s ease;
        }

        .btn-pay:hover:not([disabled]) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(244, 164, 96, 0.6);
        }

        .btn-pay:disabled {
            background: #4a3b32 !important;
            color: rgba(255,255,255,0.2) !important;
            box-shadow: none !important;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="dashboard-container">
        
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center border-bottom border-secondary border-opacity-25 pb-4 mb-4 gap-3">
            <div>
                <div class="d-flex align-items-center gap-2">
                    <div class="brand-logo"><i class="bi bi-shop"></i></div>
                    <h2 class="text-white mb-0 fw-bold">DP COFFEE SHOP</h2>
                </div>
                <span class="fw-bold text-uppercase text-white-50 small">Management Menu Terminal</span>
            </div>
            
            <div class="d-flex align-items-center gap-2 flex-wrap">
                <button class="btn btn-outline-warning btn-sm" onclick="selectAllItems()">Select All</button>
                <button class="btn btn-outline-secondary btn-sm" onclick="clearSelection()">Clear</button>
                <a href="index.html" class="btn btn-outline-danger btn-sm rounded-pill px-3 fw-bold ms-md-2">
                    <i class="bi bi-box-arrow-right me-1"></i> Logout
                </a>
            </div>
        </div>

        <div class="d-flex flex-wrap gap-2 mb-4 justify-content-start">
            <button class="btn filter-btn active" onclick="filterMenu('all')">All Menu</button>
            <button class="btn filter-btn" onclick="filterMenu('drinks')">Drinks</button>
            <button class="btn filter-btn" onclick="filterMenu('bakery')">Fresh Bakery</button>
            <button class="btn filter-btn" onclick="filterMenu('mains')">Mains & Wraps</button>
            <button class="btn filter-btn" onclick="filterMenu('desserts')">Desserts</button>
        </div>

        <div class="row g-4" id="menuItemsGrid"></div>

    </div>
</div>

<div class="payment-bar">
    <div class="container">
        <div class="row align-items-center justify-content-between">
            <div class="col-12 col-sm-auto mb-3 mb-sm-0 text-center text-sm-start">
                <div class="d-flex align-items-center justify-content-center justify-content-sm-start gap-4">
                    <div>
                        <div class="summary-label">Items Selected</div>
                        <div class="summary-value" id="selectedCount">0</div>
                    </div>
                    <div class="border-start border-secondary border-opacity-50 ps-4">
                        <div class="summary-label">Total Amount</div>
                        <div class="summary-value text-warning" id="totalPrice">Rs. 0.00</div>
                    </div>
                </div>
            </div>
            <div class="col-12 col-sm-auto text-center">
                <button id="payButton" class="btn btn-pay btn-lg text-uppercase w-100" disabled onclick="executePaymentProcess()">
                    <i class="bi bi-printer-fill me-2"></i>Proceed to Pay
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {
    loadMenuFromServer();
});

async function loadMenuFromServer() {
    try {
        const res = await fetch('api/menu/stock');
        const data = await res.json();

        const mapped = data.map(item => ({
            id: item.itemId,
            name: item.itemName,
            category: (item.category || "").toLowerCase(),
            basePrice: item.price,
            imageUrl: item.imageUrl
        }));

        renderMenuInterface(mapped);
    } catch (err) {
        console.error("Failed to load menu:", err);
    }
}




    function renderMenuInterface(items) {
        const targetGrid = document.getElementById("menuItemsGrid");
        targetGrid.innerHTML = ""; 

        items.forEach(item => {
            const cardMarkup = `
                <div class="col-12 col-md-6 col-lg-4 menu-item-node" data-category="${item.category}">
                    <div class="menu-card" data-id="${item.id}" data-name="${item.name}" data-price="${item.basePrice.toFixed(2)}" onclick="toggleItemSelection(this)">
                        <div class="select-badge"><i class="bi bi-check-lg"></i></div>
                        <div class="menu-img-wrapper">
                            <img src="${item.imageUrl}" alt="${item.name}" loading="lazy">
                        </div>
                        <div class="menu-details d-flex justify-content-between align-items-center">
                            <div>
                                <h4 class="item-title mb-1">${item.name}</h4>
                                <small class="text-white-50 text-uppercase tracking-wider small">${item.category}</small>
                            </div>
                            <span class="item-price">Rs. ${item.basePrice.toFixed(2)}</span>
                        </div>
                    </div>
                </div>
            `;
            targetGrid.insertAdjacentHTML('beforeend', cardMarkup);
        });
    }

    function toggleItemSelection(cardElement) {
        cardElement.classList.toggle('selected');
        calculateReceiptTotal();
    }

    function selectAllItems() {
        const visibleCards = document.querySelectorAll('.menu-item-node[style="display: block;"] .menu-card, .menu-item-node:not([style]) .menu-card');
        visibleCards.forEach(card => card.classList.add('selected'));
        calculateReceiptTotal();
    }

    function clearSelection() {
        const cards = document.querySelectorAll('.menu-card');
        cards.forEach(card => card.classList.remove('selected'));
        calculateReceiptTotal();
    }

    function filterMenu(category) {
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        if(window.event) { window.event.target.classList.add('active'); }

        const elements = document.querySelectorAll('.menu-item-node');
        elements.forEach(el => {
            if (category === 'all' || el.getAttribute('data-category') === category) {
                el.style.display = "block";
            } else {
                el.style.display = "none";
            }
        });
    }

    function calculateReceiptTotal() {
        const selectedCards = document.querySelectorAll('.menu-card.selected');
        let runningTotal = 0;

        selectedCards.forEach(card => {
            runningTotal += parseFloat(card.getAttribute('data-price'));
        });

        document.getElementById('selectedCount').innerText = selectedCards.length;
        document.getElementById('totalPrice').innerText = `Rs. ${runningTotal.toFixed(2)}`;

        const payButton = document.getElementById('payButton');
        if (selectedCards.length > 0) {
            payButton.removeAttribute('disabled');
        } else {
            payButton.setAttribute('disabled', 'true');
        }
    }

    function executePaymentProcess() {
        const selectedItems = [];
        const selectedCards = document.querySelectorAll('.menu-card.selected');

        let customerPhone = "Walk-in Customer";
        const savedProfile = localStorage.getItem("signupUserRecord");
        
        if (savedProfile) {
            const parsedProfile = JSON.parse(savedProfile);
            if (parsedProfile.phone) {
                customerPhone = parsedProfile.phone; 
            }
        }

        selectedCards.forEach(card => {
            selectedItems.push({
                id: card.getAttribute('data-id'),
                name: card.getAttribute('data-name'),
                price: parseFloat(card.getAttribute('data-price'))
            });
        });

        let grandTotal = 0;
        selectedItems.forEach(i => grandTotal += i.price);

        const checkoutPayload = {
            customerPhone: customerPhone, 
            items: selectedItems,
            totalAmount: grandTotal.toFixed(2)
        };
        
        localStorage.setItem("checkoutOrderPayload", JSON.stringify(checkoutPayload));
        window.location.href = 'pay.html';
    }
</script>
</body>
</html>
