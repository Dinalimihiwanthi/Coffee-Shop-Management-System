<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login | DP COFFEE SHOP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --coffee-dark: #2c1b18;
            --coffee-accent: #8c6239;
            --coffee-light: #f4f1ea;
        }
        body {
            background: linear-gradient(rgba(20, 10, 8, 0.75), rgba(20, 10, 8, 0.82)), 
                        url('https://images.unsplash.com/photo-1517256064527-09c73fc73e38?q=80&w=1920&auto=format&fit=crop') no-repeat center center/cover fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.96);
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 420px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .btn-coffee {
            background-color: var(--coffee-accent);
            color: white;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-coffee:hover {
            background-color: var(--coffee-dark);
            color: white;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(44, 27, 24, 0.3);
        }
        .form-control:focus {
            border-color: var(--coffee-accent);
            box-shadow: 0 0 0 0.25rem rgba(140, 98, 57, 0.25);
        }
    </style>
</head>
<body class="p-3">

    <div class="login-card p-4 p-sm-5 text-center">
        <div class="mb-4">
            <div class="display-5 text-warning mb-2"><i class="bi bi-shop"></i></div>
            <h2 class="fw-bold mb-1" style="color: var(--coffee-dark);">DP COFFEE SHOP</h2>
            <p class="text-muted small mb-0">Welcome back! Sign in to place your order.</p>
        </div>

        <div id="loginAlert" class="alert d-none small py-2" role="alert"></div>

        <form id="customerLoginForm" onsubmit="executeCustomerAuth(event)">
            <div class="mb-3 text-start">
                <label for="phone_number" class="form-label fw-semibold small text-secondary">Phone Number</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted"><i class="bi bi-telephone"></i></span>
                    <input type="tel" class="form-control" id="phone_number" placeholder="e.g., 0771234567" required>
                </div>
            </div>

            <div class="mb-4 text-start">
                <label for="password" class="form-label fw-semibold small text-secondary">Pin Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="password" placeholder="Enter numeric password" required>
                </div>
            </div>

            <button type="submit" class="btn btn-coffee w-100 py-2.5 rounded-pill border-0 mb-3">
                <i class="bi bi-box-arrow-in-right me-2"></i>LOGIN
            </button>
            
            <div class="small">
                <span class="text-muted">New to our shop?</span> <a href="sign_up.html" class="text-decoration-none fw-bold" style="color: var(--coffee-accent);">Create an account</a>
            </div>
        </form>
    </div>

    <script>
        async function executeCustomerAuth(event) {
            event.preventDefault();
            const alertBox = document.getElementById('loginAlert');
            
            const phone = document.getElementById('phone_number').value;
            const pass = document.getElementById('password').value;

            const isNumeric = /^\d+$/.test(pass);

            if (!isNumeric) {
                alertBox.className = "alert alert-danger small py-2";
                alertBox.innerText = "Password must consist strictly of numeric characters.";
                alertBox.classList.remove('d-none');
                return;
            }

            try {
                const formData = new URLSearchParams();
                formData.append('phone_number', phone);
                formData.append('password', pass); 

                const response = await fetch('api/system/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData
                });

                const data = await response.json();

                if (response.ok && data.status === "success") {
                    alertBox.className = "alert alert-success small py-2";
                    alertBox.innerText = data.message;
                    alertBox.classList.remove('d-none');
                    
                    setTimeout(() => { window.location.href = 'menu.html'; }, 1500);
                } else {
                    throw new Error(data.message || "Failed user authentication routing.");
                }
            } catch (err) {
                alertBox.className = "alert alert-danger small py-2";
                alertBox.innerText = err.message || "Connection error. Failed to reach verification server.";
                alertBox.classList.remove('d-none');
            }
        }
    </script>
</body>
</html>
