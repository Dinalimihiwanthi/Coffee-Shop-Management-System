<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal | DP COFFEE SHOP</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --coffee-dark: #1a0f0d;
            --coffee-accent: #d4a373;
            --coffee-glow: rgba(212, 163, 115, 0.25);
            --glass-bg: rgba(26, 15, 13, 0.75);
        }
        body {
            /* Updated to match the Modern Dark Coffee Shop background image */
            background: linear-gradient(rgba(15, 8, 7, 0.78), rgba(15, 8, 7, 0.85)), 
                        url('https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?q=80&w=1920&auto=format&fit=crop') no-repeat center center/cover fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            overflow: hidden;
        }
        .admin-card {
            /* Glassmorphism panel architecture styling */
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-top: 1px solid rgba(214, 163, 115, 0.3); /* Accent edge lighting */
            border-radius: 28px;
            width: 100%;
            max-width: 420px;
            color: #ffffff;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 
                        0 0 40px rgba(0, 0, 0, 0.3);
            transition: all 0.4s ease;
        }
        .admin-card:hover {
            border-color: rgba(214, 163, 115, 0.25);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 
                        0 0 30px var(--coffee-glow);
        }
        .form-control-dark {
            background-color: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 11px 15px;
            transition: all 0.3s ease;
        }
        .form-control-dark::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }
        .form-control-dark:focus {
            background-color: rgba(0, 0, 0, 0.5);
            border-color: var(--coffee-accent);
            color: #fff;
            box-shadow: 0 0 0 0.25rem var(--coffee-glow);
        }
        .input-group-text-dark {
            background-color: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.6);
        }
        .btn-admin {
            background: linear-gradient(135deg, #b58253, #8c6239);
            color: #fff;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        .btn-admin:hover {
            background: linear-gradient(135deg, #d4a373, #a67c52);
            color: #fff;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px var(--coffee-glow);
        }
        .btn-admin:active {
            transform: translateY(1px);
        }
        .terminal-header-icon {
            background: linear-gradient(135deg, rgba(214, 163, 115, 0.15), rgba(140, 98, 57, 0.05));
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            margin: 0 auto;
            border: 1px solid rgba(214, 163, 115, 0.3);
            box-shadow: 0 0 20px rgba(214, 163, 115, 0.1);
        }
    </style>
</head>
<body>

    <div class="admin-card p-5 animate-fade-in">
        <!-- Head Area Header -->
        <div class="text-center mb-4">
            <div class="terminal-header-icon mb-3">
                <i class="bi bi-shield-lock-fill text-warning fs-2"></i>
            </div>
            <h3 class="fw-bold mb-1" style="letter-spacing: 0.5px;">HQ System Terminal</h3>
            <p class="text-white-50 small mb-0">Authorized Admin Access Operations Only</p>
        </div>

        <!-- Alert Notification Panel Box -->
        <div id="adminAlert" class="alert d-none small py-2.5 border-0 text-center text-white shadow-sm" role="alert"></div>

        <!-- System Credentials Input Module Section -->
        <form id="adminLoginForm" onsubmit="executeAdminAuth(event)">
            <!-- Staff Identifier Target Code -->
            <div class="mb-3">
                <label for="adminId" class="form-label small text-white-50 fw-semibold">Username</label>
                <div class="input-group">
                    <span class="input-group-text input-group-text-dark"><i class="bi bi-person-badge"></i></span>
                    <input type="text" class="form-control form-control-dark" id="adminId" placeholder="e.g., admin" required>
                </div>
            </div>

            <!-- Security Access Token Input Module Key -->
            <div class="mb-4">
                <label for="adminSecret" class="form-label small text-white-50 fw-semibold">System Security Key</label>
                <div class="input-group">
                    <span class="input-group-text input-group-text-dark"><i class="bi bi-key-fill"></i></span>
                    <input type="password" class="form-control form-control-dark" id="adminSecret" placeholder="••••••••" required>
                </div>
            </div>

            <!-- Verification Action Submission Button Trigger Layout -->
            <button type="submit" class="btn btn-admin w-100 py-2.5 rounded-3 border-0 transition">
                <i class="bi bi-terminal-fill me-2"></i>Authenticate System Terminal
            </button>
        </form>
    </div>

    <script>
        async function executeAdminAuth(event) {
            event.preventDefault();
            const alertBox = document.getElementById('adminAlert');
            const username = document.getElementById('adminId').value.trim();
            const password = document.getElementById('adminSecret').value;

            try {
                const res = await fetch('api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (res.ok && data.success) {
                    alertBox.className = "alert alert-success bg-success bg-opacity-75 small py-2.5 border-0 text-center text-white";
                    alertBox.innerText = "Terminal verification complete. Decrypting management tools...";
                    alertBox.classList.remove('d-none');
                    setTimeout(() => { window.location.href = 'admin_dashboard.html'; }, 1200);
                } else {
                    alertBox.className = "alert alert-danger bg-danger bg-opacity-75 small py-2.5 border-0 text-center text-white";
                    alertBox.innerText = data.message || "Invalid username or password.";
                    alertBox.classList.remove('d-none');
                }
            } catch (err) {
                alertBox.className = "alert alert-danger bg-danger bg-opacity-75 small py-2.5 border-0 text-center text-white";
                alertBox.innerText = "Could not reach the server: " + err.message;
                alertBox.classList.remove('d-none');
            }
        }
    </script>
</body>
</html>
