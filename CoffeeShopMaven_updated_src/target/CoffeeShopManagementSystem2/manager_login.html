<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Portal Login | DP COFFEE SHOP</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --coffee-dark: #2c1b18;
            --coffee-accent: #8c6239;
            --coffee-light: #f4f1ea;
        }
        body {
            background: linear-gradient(rgba(15, 8, 7, 0.78), rgba(15, 8, 7, 0.85)), 
                        url('https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?q=80&w=1920&auto=format&fit=crop') no-repeat center center/cover fixed;
            background-color: var(--coffee-light);
            color: var(--coffee-dark);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 420px;
            overflow: hidden;
        }
        .login-header {
            background-color: var(--coffee-dark);
            color: white;
            border-bottom: 4px solid var(--coffee-accent);
            padding: 2.5rem 2rem 2rem;
            text-align: center;
        }
        .btn-coffee {
            background-color: var(--coffee-accent);
            color: white;
            padding: 0.75rem;
            font-weight: 600;
            border-radius: 10px;
            transition: all 0.2s ease;
        }
        .btn-coffee:hover {
            background-color: var(--coffee-dark);
            color: white;
        }
        .form-control:focus {
            border-color: var(--coffee-accent);
            box-shadow: 0 0 0 0.25rem rgba(140, 98, 57, 0.25);
        }
        .badge-manager {
            background-color: #0d6efd;
            font-size: 0.75rem;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- Card Header -->
        <div class="login-header">
            <div class="mb-2">
                <i class="bi bi-shop fs-1 text-warning"></i>
            </div>
            <h4 class="fw-bold mb-1">DP COFFEE SHOP</h4>
            <p class="text-white-50 small mb-2">Store Manager Portal Access</p>
            <span class="badge badge-manager p-2">
                <i class="bi bi-shield-lock-fill me-1"></i> RESTRICTED ACCESS
            </span>
        </div>

        <!-- Login Form Body -->
        <div class="p-4">
            
            <!-- Alert Box for Errors -->
            <div id="errorAlert" class="alert alert-danger d-none text-center small p-2 mb-3" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-1"></i>
                <span id="errorMessage">Invalid manager credentials.</span>
            </div>

            <form id="loginForm" onsubmit="handleManagerLogin(event)">
                <!-- Username Input -->
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Manager Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                        <input type="text" id="username" class="form-control border-start-0" placeholder="Enter username" required autofocus>
                    </div>
                </div>

                <!-- Password Input -->
                <div class="mb-4">
                    <label class="form-label small fw-semibold">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-key text-muted"></i></span>
                        <input type="password" id="password" class="form-control border-start-0" placeholder="Enter password" required>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="loginBtn" class="btn btn-coffee w-100 mb-3">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Authenticate & Enter
                </button>
            </form>

            <!--
            <div class="text-center pt-2 border-top">
                <small class="text-muted">Not a manager? <a href="index.html" class="text-decoration-none fw-semibold style="color: var(--coffee-accent);">Return to Main Login</a></small>
            </div>
        -->
            
        </div>
    </div>

    <!-- Login Authentication Script -->
    <script>
        const AUTH_API = "api/auth/login";

        // Check if manager is already logged in
        document.addEventListener("DOMContentLoaded", () => {
            const token = localStorage.getItem("jwtToken");
            const userRole = localStorage.getItem("userRole");
            
            if (token && userRole === "ROLE_MANAGER") {
                window.location.href = "manager_dashboard.html";
            }
        });

        async function handleManagerLogin(e) {
            e.preventDefault();

            const usernameInput = document.getElementById("username").value.trim();
            const passwordInput = document.getElementById("password").value;
            const loginBtn = document.getElementById("loginBtn");

            // UI Feedback
            loginBtn.disabled = true;
            loginBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span> Authenticating...`;
            hideError();

            const payload = {
                username: usernameInput,
                password: passwordInput
            };

            try {
                const response = await fetch(AUTH_API, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error("Invalid username or password.");
                }

                const data = await response.json();

                // Check if user has manager privileges
                if (data.role !== "ROLE_MANAGER" && data.role !== "ROLE_ADMIN") {
                    throw new Error("Access Denied: This account lacks Manager credentials.");
                }

                // Store JWT token and session details
                localStorage.setItem("jwtToken", data.token);
                localStorage.setItem("userRole", data.role);
                localStorage.setItem("username", data.username);

                // Redirect to Manager Dashboard
                window.location.href = "manager_dashboard.html";

            } catch (err) {
                showError(err.message);
            } finally {
                loginBtn.disabled = false;
                loginBtn.innerHTML = `<i class="bi bi-box-arrow-in-right me-1"></i> Authenticate & Enter`;
            }
        }

        function showError(message) {
            const alertBox = document.getElementById("errorAlert");
            const messageSpan = document.getElementById("errorMessage");
            messageSpan.innerText = message;
            alertBox.classList.remove("d-none");
        }

        function hideError() {
            document.getElementById("errorAlert").classList.add("d-none");
        }
    </script>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
